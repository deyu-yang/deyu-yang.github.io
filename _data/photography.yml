# 透过菱形窗格看下雪的老公寓内院，玻璃上映着暖色灯
- file: dscf2683.jpg
  date: 2023-02-03
  title_zh: 窗外的雪
  title_en: Snow Outside the Window
  alt: Snow falling in the inner courtyard of an old apartment building with wrought-iron balconies, seen through a diamond-patterned window grille with a warm lamp reflected in the glass.
  camera: Fujifilm X-S10
  lens: XC15-45mm
  focal_length: 25mm
  aperture: f/4.4
  shutter: 1/100s
