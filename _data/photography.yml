#   2. Add an entry below. Optional fields:
#      - title_zh / title_en: a short title in Chinese and English, shown before
#        the year in the lightbox, e.g. "窗外的雪 / Snow Outside the Window · 2023".
#      - memory_zh / memory_en: a memory in Chinese and its English translation,
#        shown under the shooting settings in the lightbox. Keep it to a few
#        sentences; longer stories belong in a blog post instead.
#
# Lines starting with "#" are notes for the site owner and are not shown on the site.

