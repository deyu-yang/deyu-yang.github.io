# Photos shown on /photography/, newest first.
#
# To add a photo:
#   1. Put a web version (2000px long edge, metadata cleaned, copyright added)
#      in assets/img/photography/
#   2. Add an entry below. Optional fields:
#      - title: shown before the year in the lightbox, e.g. "Victoria Harbour · 2025".
#      - memory_zh / memory_en: a short memory (one or two sentences) in Chinese
#        and its English translation, shown under the shooting settings in the
#        lightbox. Longer stories belong in a blog post instead.
#
# Lines starting with "#" are notes for the site owner and are not shown on the site.

